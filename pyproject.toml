[project]
name = "iosfb"
version = "0.1.0"
description = "Browse an iPhone's files from Windows through a localhost WebDAV share"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
dependencies = [
    "pymobiledevice3>=11.63",
    "wsgidav>=4.3",
    "cheroot>=10",
]

[project.scripts]
iosfb = "iosfb.cli:main"

[dependency-groups]
build = [
    "pyinstaller>=6.22.3",
]
dev = [
    "pytest>=8",
    "requests>=2.31",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iosfb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
